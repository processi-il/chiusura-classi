<!doctype html>
<html lang="it">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Assenze e ritardi</title>
<link rel="icon" href="favicon.svg" type="image/svg+xml">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Lato:wght@300;400;700;900&display=swap">
<link rel="stylesheet" href="il-kit.css">
<script src="https://cdnjs.cloudflare.com/ajax/libs/pdf.js/3.11.174/pdf.min.js"></script>
<script src="https://cdnjs.cloudflare.com/ajax/libs/pdf.js/3.11.174/pdf.worker.min.js"></script>
<style>
/* stili della pagina, sopra il kit IL (il-kit.css) */
main { padding-block: 22px 60px; }
.pg-head .il { display: inline-flex; align-items: center; gap: 10px; font-size: 13px; color: var(--muted); border-radius: var(--r-s); padding: 4px 8px 4px 4px; transition: background-color var(--t); }
.pg-head .il:hover { background: var(--surface-2); }
.pg-head .il img { height: 32px; width: auto; border-radius: 8px; }

.drop { display: flex; flex-direction: column; justify-content: center; align-items: center; gap: 4px; text-align: center; min-height: 150px; padding: 22px 20px; margin-bottom: 20px; border: 1.5px dashed color-mix(in srgb, var(--accent) 35%, var(--border)); border-radius: var(--r); background: var(--surface); cursor: pointer; transition: background-color var(--t), border-color var(--t), transform var(--t); }
.drop:hover, .drop.over { border-color: var(--accent); background: var(--mint); transform: translateY(-1px); }
.drop:hover .ico, .drop.over .ico { transform: scale(1.08) rotate(-4deg); }
.drop:active { transform: scale(.97); }
.drop:focus-within { outline: 3px solid var(--ring); outline-offset: 2px; }
.drop.loaded { border-style: solid; border-color: var(--card-line); }
.drop .ico { margin-bottom: 6px; }
.drop b { font-size: 18px; }
.drop small { color: var(--muted); font-size: 14px; }
.drop .fname { margin-top: 6px; font-size: 15px; color: var(--accent-t); font-weight: 700; min-height: 1.4em; word-break: break-all; }

.kpis { margin-bottom: 14px; }
.toolbar { display: flex; flex-wrap: wrap; gap: 10px 16px; align-items: center; justify-content: space-between; margin-bottom: 16px; }
.toolbar .note { flex: 1 1 320px; max-width: 68ch; }
#out > .acc-item, #out > .card { margin-bottom: 16px; }
.acc-item > summary { color: var(--accent-t); }
.acc-item .in { padding: 0; overflow-x: auto; }
.overview { width: 100%; border-collapse: collapse; font-size: 14px; }
.overview th, .overview td { padding: 8px 18px; border-top: 1px solid var(--e-line); text-align: left; }
.overview th { font-size: 11px; text-transform: uppercase; letter-spacing: .09em; color: var(--muted); font-weight: 700; }
.overview td.n { font-variant-numeric: tabular-nums; }
.overview tbody tr { transition: background-color var(--t); }
.overview tbody tr:hover { background: var(--mint); }

.card .h { flex-wrap: wrap; align-items: center; margin-bottom: 4px; }
.card .h .sp { flex: 1; }
.nums { display: flex; gap: 6px; flex-wrap: wrap; }
ul.righe { margin: 0; padding: 0; list-style: none; }
ul.righe li { padding: 9px 0; border-top: 1px solid var(--e-line); display: grid; grid-template-columns: minmax(0, 1fr) minmax(0, 1.3fr) 170px; gap: 2px 14px; align-items: center; font-size: 15px; }
ul.righe li:first-child { border-top: 0; }
.stato { text-align: right; }
.stato .badge { min-width: 150px; text-align: center; }
.stato .nota { display: block; font-size: 12px; color: var(--muted); margin-top: 2px; }
.name { font-weight: 700; }
.det { color: var(--muted); font-size: 13px; }
.badge { display: inline-block; border-radius: 999px; padding: 2px 9px; font-size: 12px; font-weight: 700; white-space: nowrap; }
.b-ok { background: color-mix(in srgb, var(--G) 18%, transparent); color: var(--G-t); }
.b-warn { background: color-mix(in srgb, var(--O) 16%, transparent); color: var(--O-t); }
.b-err { background: color-mix(in srgb, var(--R) 14%, transparent); color: var(--R-t); }
.b-info { background: color-mix(in srgb, var(--B) 14%, transparent); color: var(--B-t); }
.tutti { color: var(--muted); font-size: 14px; }
.hidden { display: none !important; }
@media (max-width: 640px) {
  ul.righe li { grid-template-columns: minmax(0, 1fr) auto; }
  ul.righe li .det { grid-column: 1; grid-row: 2; }
  ul.righe li .stato { grid-column: 2; grid-row: 1 / span 2; }
  .stato .badge { min-width: 0; }
}
@media print {
  :root, :root:not([data-theme="light"]) { color-scheme: light; --bg: #fff; --surface: #fff; --fg: #000; --muted: #444; --e-line: #bbb;
    --R-t: #B71928; --O-t: #B0480F; --G-t: #4A7A14; --B-t: #00699A; }
  body { background: #fff; font-size: 12px; }
  .pg-head, .drop, .kpis, .toolbar, .acc-item, .no-print { display: none !important; }
  main { padding: 0; }
  .wrap { max-width: none; }
  .card { border: 0; border-radius: 0; margin: 0; padding: 0; page-break-after: always; }
  .card .h { border-bottom: 2px solid #000; font-size: 18px; padding: 0 0 6px; }
  .card .h::after { content: attr(data-date); font-size: 13px; font-weight: 400; margin-left: auto; }
  ul.righe li { font-size: 12px; padding: 5px 0; }
  .badge { border: 1px solid currentColor; }
}
</style>
</head>
<body>
<main class="wrap gut">
  <header class="pg-head">
    <div>
      <div class="eyebrow">Report per i responsabili di classe · prova</div>
      <h1>Assenze e <b>ritardi</b></h1>
      <p class="sub" id="dayLabel">Carica il registro del giorno</p>
    </div>
    <a class="il" href="https://www.immaginazioneelavoro.it" target="_blank" rel="noopener"><img src="il-logo.png" alt="">Immaginazione e Lavoro</a>
  </header>
  <label class="drop" id="drop">
    <span class="ico c-B"><svg class="i" viewBox="0 0 24 24" aria-hidden="true"><path d="M14 3H6a1 1 0 0 0-1 1v16a1 1 0 0 0 1 1h12a1 1 0 0 0 1-1V8z"/><path d="M14 3v5h5"/></svg></span>
    <b>Registro ClasseViva (PDF)</b>
    <small>Trascina qui il PDF della giornata o clicca per sceglierlo</small>
    <span class="fname" id="fname"></span>
    <input type="file" id="inPdf" accept=".pdf" class="sr-only">
  </label>
  <div id="out"></div>
</main>

<script>
/*CORE-START*/
const ROMAN = ['', 'I', 'II', 'III', 'IV', 'V', 'VI', 'VII', 'VIII', 'IX', 'X', 'XI', 'XII'];
const MESI = ['gennaio', 'febbraio', 'marzo', 'aprile', 'maggio', 'giugno', 'luglio', 'agosto', 'settembre', 'ottobre', 'novembre', 'dicembre'];
const norm = s => String(s ?? '').normalize('NFD').replace(/[̀-ͯ]/g, '').toUpperCase().replace(/[^A-Z]/g, '');
const pad = n => String(n).padStart(2, '0');

// pages: [{ items: [{ str, x, y }] }] (coordinate pdf.js: y cresce verso l'alto)
function parseAppello(pages) {
  const classi = [];
  let date = null;
  for (const page of pages) {
    const items = page.items.filter(it => it.str.trim());
    const header = items.find(it => /Registro di classe/.test(it.str));
    if (!header) continue;
    const m = header.str.match(/Registro di classe\s+(.+?)-[A-Z]{4}\d+\S*\s+per il\s+(\d{1,2})\s+(\w+)\s+(\d{4})/i);
    const classe = (m ? m[1] : '?').replace(/\s+APP$/i, '').replace(/_.*$/, '').trim().toUpperCase();
    if (m && !date) { const mm = MESI.indexOf(m[3].toLowerCase()) + 1; if (mm) date = `${m[4]}-${pad(mm)}-${pad(m[2])}`; }

    const giorno = items.find(it => it.str.trim() === 'Giorno');
    const yTop = giorno ? giorno.y : Infinity;
    const xGiorno = giorno ? giorno.x : 157;
    const stops = items.filter(it => /^(Ora|Giustificazioni|Note)$/.test(it.str.trim()) && it.y < yTop).map(it => it.y);
    const yBottom = stops.length ? Math.max(...stops) : -Infinity;
    // colonne delle ore dalla riga di intestazione
    const oreX = items.filter(it => Math.abs(it.y - yTop) < 3 && ROMAN.indexOf(it.str.trim()) > 0)
      .map(it => ({ ora: ROMAN.indexOf(it.str.trim()), x: it.x + it.w / 2 }));
    const xFirstHour = oreX.length ? Math.min(...oreX.map(o => o.x)) - 12 : 185;

    // studenti: righe di nome nella colonna di sinistra, una riga numerata apre un nuovo studente
    const grid = items.filter(it => it.y < yTop - 3 && it.y > yBottom);
    const students = [];
    for (const it of grid.filter(it => it.x < xGiorno - 5).sort((a, b) => b.y - a.y)) {
      const s = it.str.trim();
      const n = s.match(/^(\d+)\s+(.*)$/);
      if (n) students.push({ n: +n[1], y: it.y, parts: [n[2]], codice: '', ore: {} });
      else if (students.length) students[students.length - 1].parts.push(s);
    }
    const owner = it => {
      let best = null;
      for (const st of students) if (st.y + 4 >= it.y && (!best || st.y < best.y)) best = st;
      return best;
    };
    for (const it of grid.filter(it => it.x >= xGiorno - 5)) {
      const st = owner(it); if (!st) continue;
      const s = it.str.trim();
      if (it.x < xFirstHour) st.codice += s;
      else if (oreX.length) {
        const cx = it.x + it.w / 2;
        const o = oreX.reduce((a, b) => Math.abs(b.x - cx) < Math.abs(a.x - cx) ? b : a);
        st.ore[o.ora] = s;
      }
    }
    for (const st of students) st.nome = st.parts.join(' ').replace(/\s+\d{2}\.\d{2}$/, '').replace(/\s+/g, ' ').trim();

    // giustificazioni
    const giust = [];
    for (const it of items) {
      const g = it.str.trim().match(/^(.+?)\s+giustifica\s+(?:il\s+|l')?(assenza|ritardo|uscita)\b(?:.*?(\d{2})\/(\d{2})\/(\d{4}))?/i);
      if (g) giust.push({ nome: g[1].trim(), tipo: g[2].toLowerCase(), data: g[3] ? `${g[5]}-${g[4]}-${g[3]}` : null });
    }
    classi.push({ classe, studenti: students, giust });
  }
  return { date, classi };
}

const TIPO_CODICE = { A: 'assenza', R: 'ritardo', U: 'uscita' };

function reportClasse(c, date) {
  const eventi = [];
  // prima ora di lezione della classe: chi è segnato R ma è presente già da quell'ora ha fatto un ritardo breve
  const primaOra = Math.min(...c.studenti.flatMap(st => Object.keys(st.ore).map(Number)));
  const usate = new Set();
  for (const st of c.studenti) {
    const cod = st.codice.toUpperCase();
    if (!cod || cod === 'P' || cod === 'X') continue;
    const oreNum = Object.keys(st.ore).map(Number).sort((a, b) => a - b);
    const presenti = oreNum.filter(o => /^P/.test(st.ore[o]));
    const assentiOre = oreNum.filter(o => /^A/.test(st.ore[o]));
    let tipi, dettaglio = '', breve = false;
    if (cod === 'A') { tipi = ['assenza']; dettaglio = 'assente tutto il giorno'; }
    else if (cod === 'R') {
      tipi = ['ritardo'];
      breve = presenti.length > 0 && presenti[0] === primaOra;
      dettaglio = breve ? `ritardo breve, presente dalla ${ROMAN[primaOra]} ora come la classe` : presenti.length ? `presente dalla ${ROMAN[presenti[0]]} ora` : '';
    }
    else if (cod === 'U') { tipi = ['uscita']; dettaglio = presenti.length ? `presente fino alla ${ROMAN[presenti[presenti.length - 1]]} ora` : ''; }
    else { tipi = ['ritardo', 'uscita']; dettaglio = assentiOre.length ? `assente nelle ore ${assentiOre.map(o => ROMAN[o]).join(', ')}` : 'ingressi/uscite multipli'; }
    const key = norm(st.nome);
    const g = c.giust.map((x, i) => ({ ...x, i })).filter(x => !usate.has(x.i) && norm(x.nome) === key && tipi.includes(x.tipo) && (x.data === date || !x.data));
    g.forEach(x => usate.add(x.i));
    eventi.push({
      nome: st.nome, codice: cod, tipo: cod === 'A' ? 'assenza' : cod === 'R' ? 'ritardo' : cod === 'U' ? 'uscita' : 'ritardo/uscita',
      dettaglio, breve, giustificato: g.length > 0, daGiustificare: !g.length && !breve, senzaData: g.length > 0 && g.every(x => !x.data),
    });
  }
  const altre = c.giust.filter((x, i) => !usate.has(i));
  return {
    classe: c.classe,
    totStudenti: c.studenti.length,
    assenze: eventi.filter(e => e.tipo === 'assenza'),
    ritardi: eventi.filter(e => e.tipo !== 'assenza'),
    precedenti: altre.filter(x => x.data && x.data !== date),
    senzaData: altre.filter(x => !x.data),
    oggiAltro: altre.filter(x => x.data === date),
    codiciX: c.studenti.filter(s => s.codice.toUpperCase() === 'X').length,
  };
}
/*CORE-END*/

const $ = id => document.getElementById(id);
const esc = s => String(s ?? '').replace(/[&<>"]/g, c => ({ '&': '&amp;', '<': '&lt;', '>': '&gt;', '"': '&quot;' }[c]));
const fmtDate = iso => { const [y, m, d] = iso.split('-'); return `${+d}/${+m}/${y}`; };
const fmtLong = iso => { const [y, m, d] = iso.split('-'); return `${+d} ${MESI[m - 1]} ${y}`; };
const TIPO_LABEL = { assenza: 'assenza', ritardo: 'ritardo', uscita: 'uscita anticipata' };

async function readPdf(file) {
  const doc = await pdfjsLib.getDocument({ data: new Uint8Array(await file.arrayBuffer()) }).promise;
  const pages = [];
  for (let p = 1; p <= doc.numPages; p++) {
    const tc = await (await doc.getPage(p)).getTextContent();
    pages.push({ items: tc.items.map(it => ({ str: it.str, x: it.transform[4], y: it.transform[5], w: it.width })) });
  }
  return pages;
}

function stato(e) {
  if (e.daGiustificare) return '<span class="stato"><span class="badge b-err">Da giustificare</span></span>';
  if (!e.giustificato) return '<span class="stato"><span class="badge b-info">Non serve giustifica</span></span>';
  return `<span class="stato"><span class="badge b-ok">Giustificato</span>${e.senzaData ? '<span class="nota">data non leggibile nel PDF</span>' : ''}</span>`;
}

function testoClasse(r, date) {
  const L = [`Classe ${r.classe} — ${fmtLong(date)}`];
  L.push('', `Assenti (${r.assenze.length}):`);
  r.assenze.forEach(e => L.push(`- ${e.nome}: ${e.daGiustificare ? 'DA GIUSTIFICARE' : 'giustificato'}`));
  if (!r.assenze.length) L.push('- nessuno');
  L.push('', `Ritardi e uscite (${r.ritardi.length}):`);
  r.ritardi.forEach(e => L.push(`- ${e.nome}: ${e.tipo}${e.dettaglio ? ` (${e.dettaglio})` : ''}, ${e.daGiustificare ? 'DA GIUSTIFICARE' : e.giustificato ? 'giustificato' : 'non serve giustifica'}`));
  if (!r.ritardi.length) L.push('- nessuno');
  if (r.precedenti.length) {
    L.push('', 'Giustificazioni consegnate oggi per giorni precedenti:');
    r.precedenti.forEach(g => L.push(`- ${g.nome}: ${TIPO_LABEL[g.tipo]} del ${fmtDate(g.data)}`));
  }
  if (r.senzaData.length) {
    L.push('', 'Giustificazioni senza data leggibile:');
    r.senzaData.forEach(g => L.push(`- ${g.nome}: ${TIPO_LABEL[g.tipo]}`));
  }
  return L.join('\n');
}

function render(data) {
  const reports = data.classi.map(c => reportClasse(c, data.date));
  $('dayLabel').textContent = `${fmtLong(data.date)} · ${reports.length} classi`;
  const tot = k => reports.reduce((s, r) => s + r[k].length, 0);
  const daG = reports.reduce((s, r) => s + [...r.assenze, ...r.ritardi].filter(e => e.daGiustificare).length, 0);
  let html = `<div class="kpis">
      <div class="kpi"><b>${tot('assenze')}</b><span>assenti</span></div>
      <div class="kpi"><b>${tot('ritardi')}</b><span>ritardi e uscite</span></div>
      <div class="kpi"><b class="${daG ? 't-R' : ''}">${daG}</b><span>da giustificare</span></div>
    </div>
    <div class="toolbar">
      <p class="note">"Giustificato" = sul registro c'è la giustificazione di oggi. Il PDF di un solo giorno non mostra le assenze ancora aperte dei giorni passati: in fondo a ogni classe trovi le giustificazioni consegnate oggi per giorni precedenti.</p>
      <button type="button" class="btn btn-g btn-s" onclick="window.print()"><svg class="i" viewBox="0 0 24 24" aria-hidden="true"><path d="M6 18H4a2 2 0 0 1-2-2v-5a2 2 0 0 1 2-2h16a2 2 0 0 1 2 2v5a2 2 0 0 1-2 2h-2"/><path d="M6 9V3a1 1 0 0 1 1-1h10a1 1 0 0 1 1 1v6"/><rect x="6" y="14" width="12" height="8" rx="1"/></svg>Stampa (una pagina per classe)</button>
    </div>
    <details class="acc-item"><summary>Riepilogo per classe<svg class="i chev" viewBox="0 0 24 24" aria-hidden="true"><path d="m6 9 6 6 6-6"/></svg></summary>
    <div class="in"><table class="overview"><thead><tr><th>Classe</th><th>Assenti</th><th>Ritardi / uscite</th><th>Da giustificare</th><th>Giust. giorni prec.</th></tr></thead><tbody>
    ${reports.map(r => {
      const dg = [...r.assenze, ...r.ritardi].filter(e => e.daGiustificare).length;
      return `<tr><td><a class="lnk" href="#cl-${esc(r.classe)}">${esc(r.classe)}</a></td><td class="n">${r.assenze.length}</td><td class="n">${r.ritardi.length}</td>
        <td class="n">${dg ? `<span class="badge b-err">${dg}</span>` : '0'}</td><td class="n">${r.precedenti.length}</td></tr>`;
    }).join('')}</tbody></table></div></details>`;

  for (const r of reports) {
    const li = e => `<li><span class="name">${esc(e.nome)}</span><span class="det">${e.tipo !== 'assenza' ? esc(e.tipo) + (e.dettaglio ? ' · ' + esc(e.dettaglio) : '') : ''}</span>${stato(e)}</li>`;
    html += `<div class="card" id="cl-${esc(r.classe)}"><h3 class="h" data-date="${fmtLong(data.date)}">Classe ${esc(r.classe)}
        <span class="nums"><span class="badge b-info">${r.assenze.length} assenti</span><span class="badge b-warn">${r.ritardi.length} ritardi/uscite</span></span>
        <span class="sp"></span><button type="button" class="btn btn-g btn-s no-print" data-copy="${esc(r.classe)}">Copia testo</button></h3>
      <div>
        <h4 class="sub-h">Assenti</h4>${r.assenze.length ? `<ul class="righe">${r.assenze.map(li).join('')}</ul>` : '<div class="tutti">Nessun assente</div>'}
        <h4 class="sub-h">Ritardi e uscite anticipate</h4>${r.ritardi.length ? `<ul class="righe">${r.ritardi.map(li).join('')}</ul>` : '<div class="tutti">Nessuno</div>'}
        ${r.precedenti.length ? `<h4 class="sub-h">Giustificazioni consegnate oggi per giorni precedenti</h4><ul class="righe">${r.precedenti.map(g => `<li><span class="name">${esc(g.nome)}</span><span class="det">${TIPO_LABEL[g.tipo]} del ${fmtDate(g.data)}</span><span class="stato"><span class="badge b-ok">Giustificata</span></span></li>`).join('')}</ul>` : ''}
        ${r.senzaData.length ? `<h4 class="sub-h">Giustificazioni senza data leggibile</h4><ul class="righe">${r.senzaData.map(g => `<li><span class="name">${esc(g.nome)}</span><span class="det">${TIPO_LABEL[g.tipo]} · la data è tagliata nel PDF</span><span class="stato"><span class="badge b-warn">Da controllare</span></span></li>`).join('')}</ul>` : ''}
        ${r.codiciX ? `<p class="tutti">${r.codiciX} studenti segnati "X" nella colonna del giorno (non conteggiati).</p>` : ''}
      </div></div>`;
  }
  $('out').innerHTML = html;
  $('out').querySelectorAll('[data-copy]').forEach(b => b.addEventListener('click', async () => {
    const r = reports.find(x => x.classe === b.dataset.copy);
    try { await navigator.clipboard.writeText(testoClasse(r, data.date)); b.textContent = 'Copiato ✓'; }
    catch { b.textContent = 'Copia non riuscita'; }
    setTimeout(() => { b.textContent = 'Copia testo'; }, 1500);
  }));
}

async function load(file) {
  $('fname').textContent = 'Lettura…';
  try { const data = parseAppello(await readPdf(file)); $('fname').textContent = file.name; drop.classList.add('loaded'); render(data); }
  catch (e) { $('fname').textContent = 'Errore: ' + e.message; }
}
const drop = $('drop');
$('inPdf').addEventListener('change', e => e.target.files[0] && load(e.target.files[0]));
drop.addEventListener('dragover', e => { e.preventDefault(); drop.classList.add('over'); });
drop.addEventListener('dragleave', () => drop.classList.remove('over'));
drop.addEventListener('drop', e => { e.preventDefault(); drop.classList.remove('over'); e.dataTransfer.files[0] && load(e.dataTransfer.files[0]); });
</script>
</body>
</html>
